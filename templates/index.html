<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificator - Dynamic Certificate Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Open+Sans&family=Lato&family=Montserrat&family=Oswald&family=Charm&family=Playfair+Display&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .preview-container {
            position: relative;
            overflow: hidden;
            border: 2px dashed #e5e7eb;
            background-color: #f9fafb;
        }
        .draggable-field {
            position: absolute;
            cursor: move;
            border: 1px dashed rgba(79, 70, 229, 0.5);
            background-color: rgba(79, 70, 229, 0.1);
            padding: 4px;
            white-space: nowrap;
            user-select: none;
        }
        .draggable-field:hover {
            border-color: #4f46e5;
            background-color: rgba(79, 70, 229, 0.2);
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="text-xl font-bold text-indigo-600">Certificator</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Config -->
            <div class="lg:col-span-4 space-y-6">
                <!-- 1. Files -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-lg font-semibold mb-4">1. Files</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">CSV File</label>
                            <input type="file" id="csvFile" accept=".csv" class="mt-1 block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Template Image</label>
                            <input type="file" id="templateFile" accept="image/*" class="mt-1 block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                        </div>
                    </div>
                </div>

                <!-- 2. Fields -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold">2. Fields</h2>
                        <button id="addFieldBtn" class="px-3 py-1 text-xs font-medium text-white bg-indigo-600 rounded hover:bg-indigo-700" disabled>+ Add Field</button>
                    </div>
                    <div id="fieldsContainer" class="space-y-4 max-h-96 overflow-y-auto pr-2">
                        <p class="text-sm text-gray-500 italic" id="noFieldsMsg">Upload CSV to add fields.</p>
                        <!-- Field items will go here -->
                    </div>
                </div>

                <!-- 3. Generate -->
                 <div class="bg-white p-6 rounded-lg shadow-md">
                    <button id="generateBtn" class="w-full py-3 px-4 rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Generate Certificates
                    </button>
                    <div id="statusMsg" class="text-center text-sm font-medium mt-2 hidden"></div>
                    <div id="downloadSection" class="mt-4 hidden text-center">
                        <a id="downloadLink" href="#" class="inline-block px-4 py-2 border border-transparent text-sm font-medium rounded-md text-green-700 bg-green-100 hover:bg-green-200">
                            Download ZIP
                        </a>
                    </div>
                </div>
            </div>

            <!-- Right Column: Preview & Emails -->
            <div class="lg:col-span-8 space-y-6">
                
                <!-- Preview -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-lg font-semibold">Preview & Layout</h2>
                        <span class="text-xs text-gray-500">Drag fields to position them</span>
                    </div>
                    
                    <div class="preview-container flex items-center justify-center relative w-full bg-gray-200 rounded" style="min-height: 500px">
                        <img id="previewImage" class="max-w-full max-h-full object-contain pointer-events-none opacity-50" src="" alt="Preview">
                        <div id="overlayLayer" class="absolute inset-0 w-full h-full pointer-events-none">
                            <!-- Draggables go here -->
                        </div>
                    </div>
                </div>

                <!-- Email (Optional) -->
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between mb-4">
                        <h2 class="text-lg font-semibold">3. Send Emails</h2>
                        <button id="toggleEmail" class="text-sm text-indigo-600 hover:underline">Show/Hide</button>
                    </div>
                    <div id="emailForm" class="space-y-4 hidden">
                         <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Email (Gmail)</label>
                                <input type="email" id="senderEmail" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">App Password</label>
                                <input type="password" id="appPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Subject</label>
                            <input type="text" id="emailSubject" value="Your Certificate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Body</label>
                            <textarea id="emailBody" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">Hi {name}, Here is your certificate.</textarea>
                        </div>
                        <button id="sendEmailBtn" class="w-full py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                            Send Emails
                        </button>
                        <div id="emailStatus" class="text-sm mt-2 max-h-32 overflow-y-auto bg-gray-100 p-2 rounded hidden"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // State
        let csvHeaders = [];
        let fields = []; // { id, column, font, size, color, x, y }
        let displayedImageWidth = 0;
        let displayedImageHeight = 0;
        let naturalImageWidth = 0;
        let naturalImageHeight = 0;

        // Elements
        const csvInput = document.getElementById('csvFile');
        const templateInput = document.getElementById('templateFile');
        const previewImage = document.getElementById('previewImage');
        const overlayLayer = document.getElementById('overlayLayer');
        const fieldsContainer = document.getElementById('fieldsContainer');
        const addFieldBtn = document.getElementById('addFieldBtn');
        const generateBtn = document.getElementById('generateBtn');

        // CSV Parsing
        csvInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const firstLine = text.split('\n')[0];
                    csvHeaders = firstLine.split(',').map(h => h.trim());
                    document.getElementById('noFieldsMsg').classList.add('hidden');
                    addFieldBtn.disabled = false;
                    checkGenerateReady();
                    
                    // Update existing dropdowns if any
                    updateAllDropdowns();
                };
                reader.readAsText(file);
            }
        });

        // Template Preview
        templateInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    previewImage.src = url;
                    previewImage.onload = () => {
                        naturalImageWidth = previewImage.naturalWidth;
                        naturalImageHeight = previewImage.naturalHeight;
                        updateDimensions();
                        checkGenerateReady();
                        previewImage.classList.remove('opacity-50');
                    };
                }
        });

        window.addEventListener('resize', updateDimensions);

        function syncOverlayLayer() {
            if (!previewImage.src || !naturalImageWidth || !naturalImageHeight) return;

            const imageRect = previewImage.getBoundingClientRect();
            const containerRect = overlayLayer.parentElement.getBoundingClientRect();

            overlayLayer.style.inset = 'auto';
            overlayLayer.style.left = `${imageRect.left - containerRect.left}px`;
            overlayLayer.style.top = `${imageRect.top - containerRect.top}px`;
            overlayLayer.style.width = `${imageRect.width}px`;
            overlayLayer.style.height = `${imageRect.height}px`;
        }

        function updateDimensions() {
            if (!previewImage.src) return;
            syncOverlayLayer();
            fields.forEach(field => updateFieldOverlay(field.id));
        }

        // Add Field Logic
        addFieldBtn.addEventListener('click', () => {
            const id = Date.now();
            const newField = {
                id,
                column: csvHeaders[0] || '',
                font: 'Arial',
                size: 40,
                color: '#000000',
                alignment: 'center',
                x: naturalImageWidth / 2 || 100, // Default to centerish or 100
                y: naturalImageHeight / 2 || 100
            };
            fields.push(newField);
            renderFieldEditor(newField);
            renderFieldOverlay(newField);
        });

        // Render Editor Item
        function renderFieldEditor(field) {
            const div = document.createElement('div');
            div.id = `editor-${field.id}`;
            div.className = "p-4 border rounded bg-gray-50 relative group";
            div.innerHTML = `
                <button onclick="removeField(${field.id})" class="absolute top-2 right-2 text-red-500 hover:text-red-700 font-bold">&times;</button>
                <div class="grid grid-cols-2 gap-2">
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-gray-500">Column</label>
                        <select onchange="updateField(${field.id}, 'column', this.value)" class="w-full text-sm border rounded p-1">
                            ${csvHeaders.map(h => `<option value="${h}" ${h === field.column ? 'selected' : ''}>${h}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">Font</label>
                        <select onchange="updateField(${field.id}, 'font', this.value)" class="w-full text-sm border rounded p-1">
                            <option value="Arial">Arial</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Charm">Charm</option>
                            <option value="Playfair Display">Playfair</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">Size</label>
                        <input type="number" value="${field.size}" onchange="updateField(${field.id}, 'size', this.value)" class="w-full text-sm border rounded p-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">Align</label>
                        <select onchange="updateField(${field.id}, 'alignment', this.value)" class="w-full text-sm border rounded p-1">
                            <option value="left" ${field.alignment === 'left' ? 'selected' : ''}>Left</option>
                            <option value="center" ${field.alignment === 'center' ? 'selected' : ''}>Center</option>
                            <option value="right" ${field.alignment === 'right' ? 'selected' : ''}>Right</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">Color</label>
                        <input type="color" value="${field.color}" onchange="updateField(${field.id}, 'color', this.value)" class="w-full h-8 border rounded p-0">
                    </div>
                    <div class="text-[10px] text-gray-400 col-span-2 text-center pt-1">
                        Drag name on preview to position
                    </div>
                </div>
            `;
            fieldsContainer.appendChild(div);
            // Scroll to bottom
            fieldsContainer.scrollTop = fieldsContainer.scrollHeight;
        }

        // Render Overlay Item
        function renderFieldOverlay(field) {
            const el = document.createElement('div');
            el.id = `overlay-${field.id}`;
            el.className = "draggable-field pointer-events-auto transform -translate-x-1/2 -translate-y-1/2";
            el.innerText = `{${field.column}}`;
            
            // Interaction logic
            let isDragging = false;
            
            el.addEventListener('mousedown', (e) => {
                isDragging = true;
                el.style.zIndex = 100;
                e.preventDefault(); // Prevent text selection
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                // Calculate position relative to container
                const rect = previewImage.getBoundingClientRect();
                const xRel = e.clientX - rect.left;
                const yRel = e.clientY - rect.top;

                // Scale to natural dimensions
                const scaleX = naturalImageWidth / rect.width;
                const scaleY = naturalImageHeight / rect.height;

                field.x = Math.round(xRel * scaleX);
                field.y = Math.round(yRel * scaleY);

                updateFieldOverlay(field.id);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                el.style.zIndex = '';
            });

            overlayLayer.appendChild(el);
            updateFieldOverlay(field.id);
        }

        function updateField(id, key, value) {
            const f = fields.find(f => f.id === id);
            if (f) {
                f[key] = value;
                // Update Overlay Text if column changed
                if (key === 'column') {
                     document.getElementById(`overlay-${id}`).innerText = `{${value}}`;
                }
                updateFieldOverlay(id);
            }
        }

        function updateFieldOverlay(id) {
            const f = fields.find(f => f.id === id);
            const el = document.getElementById(`overlay-${id}`);
            if (!f || !el || !naturalImageWidth) return;

            syncOverlayLayer();

            const rect = overlayLayer.getBoundingClientRect();
            const scaleX = rect.width / naturalImageWidth;
            const scaleY = rect.height / naturalImageHeight;

            const left = f.x * scaleX;
            const top = f.y * scaleY;
            
            // Assuming font size also needs scaling for preview visual accuracy
            // But usually font size is relative to screen. 
            // To make it look "proportional", we scale it down by the image scale.
            const fontSizeObj = f.size * scaleX; 

            el.style.left = `${left}px`;
            el.style.top = `${top}px`;
            el.style.fontFamily = f.font;
            el.style.fontSize = `${fontSizeObj}px`;
            el.style.color = f.color;
        }

        function removeField(id) {
            fields = fields.filter(f => f.id !== id);
            document.getElementById(`editor-${id}`).remove();
            document.getElementById(`overlay-${id}`).remove();
        }

        function updateAllDropdowns() {
             fields.forEach(f => {
                 const select = document.querySelector(`#editor-${f.id} select`);
                 // Simplistic: just rerender editor
                 document.getElementById(`editor-${f.id}`).remove();
                 renderFieldEditor(f);
             });
        }

        function checkGenerateReady() {
            generateBtn.disabled = !(csvInput.files.length && templateInput.files.length);
        }

        // Generate Action
        generateBtn.addEventListener('click', async () => {
            if (!fields.length) {
                if(!confirm("No fields added. Generate blank certificates?")) return;
            }

            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = "Generating...";
            statusMsg.classList.remove('hidden', 'text-red-600', 'text-green-600');
            statusMsg.classList.add('text-indigo-600');
            generateBtn.disabled = true;

            const formData = new FormData();
            formData.append('csvFile', csvInput.files[0]);
            formData.append('templateFile', templateInput.files[0]);
            formData.append('fieldConfigs', JSON.stringify(fields));

             try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (response.ok) {
                    statusMsg.textContent = result.message;
                    statusMsg.classList.add('text-green-600');
                    document.getElementById('downloadLink').href = result.downloadUrl;
                    document.getElementById('downloadSection').classList.remove('hidden');
                } else {
                    throw new Error(result.error || "Unknown error");
                }
            } catch (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.classList.add('text-red-600');
            } finally {
                generateBtn.disabled = false;
            }
        });

        // Email Toggle
        document.getElementById('toggleEmail').addEventListener('click', () => {
             document.getElementById('emailForm').classList.toggle('hidden');
        });

    </script>
</body>
</html>
